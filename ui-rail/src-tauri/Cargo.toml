[package]
name = "relain-it-rail"
version = "0.1.0"
description = "Sovereign System Rail for relAIn-it"
authors = ["Brian"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
window-vibrancy = "0.5"
tokio = { version = "1", features = ["full"] }
rodio = "0.17"
vosk = "0.3"
cpal = "0.15"
tts = "0.26"
arboard = "3"
enigo = "0.2"
global-hotkey = "0.5"
lazy_static = "1.4"
crossbeam-channel = "0.5.15"
